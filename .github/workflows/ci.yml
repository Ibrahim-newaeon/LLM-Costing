name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # §A2 — Zod is canonical, /schemas/*.json is build output. This is the drift gate.
      # Proven in both directions on 2026-09-07: hand-editing a generated file turns it red.
      - name: Schema drift gate
        run: pnpm check:schemas
